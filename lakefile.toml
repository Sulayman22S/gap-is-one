name = "conj2"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Conj2", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "Conj2"

# The statement surface and the single-module proof that `lake comparator` judges
# (see comparator.json). Solution.lean is generated by tools/make_solution.py.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
